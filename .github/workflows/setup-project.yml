name: WinlatorHUD CI

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: '填写版本号则发布 AAR（如 2.0.0），留空则初始化项目结构'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    paths:
      - '.github/workflows/setup-project.yml'

permissions:
  contents: write

jobs:
  setup:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.release_version == '' || github.event.inputs.release_version == null)
    runs-on: ubuntu-latest
