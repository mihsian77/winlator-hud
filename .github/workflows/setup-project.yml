          # 配置指南

          ## 初始化

          ```java
          WinlatorHUD.init(activity);

          int mask = WinlatorHUD.SHOW_FPS | WinlatorHUD.SHOW_GPU_LOAD
                   | WinlatorHUD.SHOW_CPU_LOAD | WinlatorHUD.SHOW_RAM;
          WinlatorHUD.init(activity, mask, WinlatorHUD.DENSITY_NORMAL);
          ```

          ## 密度模式

          | 模式 | 常量 | 指标数量 |
          |------|------|----------|
          | 精简 | DENSITY_COMPACT | 4 项 |
          | 标准 | DENSITY_NORMAL | 14 项 |
          | 详细 | DENSITY_DETAILED | 24 项 |

          ## 元素位掩码

          帧统计: SHOW_FPS, SHOW_FRAMETIME, SHOW_AVG_FPS, SHOW_1PC_LOW, SHOW_01PC_LOW, SHOW_GRAPH
          GPU: SHOW_GPU_LOAD, SHOW_GPU_TEMP, SHOW_GPU_CLOCK, SHOW_VRAM
          CPU: SHOW_CPU_LOAD, SHOW_CPU_TEMP, SHOW_CPU_CLOCK, SHOW_CPU_CORES
          系统: SHOW_RAM, SHOW_SWAP, SHOW_BATTERY, SHOW_BATTERY_TIME, SHOW_NETWORK
          容器: SHOW_ENGINE, SHOW_RESOLUTION, SHOW_WINE_VERSION, SHOW_DURATION, SHOW_THROTTLE

          ## 运行时控制

          ```java
          WinlatorHUD hud = WinlatorHUD.getInstance();
          hud.setDensity(WinlatorHUD.DENSITY_COMPACT);
          hud.setVertical(true);
          hud.setScale(0.9f);
          hud.setLocked(true);
          hud.resetStats();
          ```
          DOC_EOF

          cat > docs/API_REFERENCE.md << 'DOC_EOF'
          # API 参考

          ## 静态方法

          | 方法 | 说明 |
          |------|------|
          | init(Activity) | 默认配置初始化 |
          | init(Activity, int mask, int density) | 自定义配置初始化 |
          | getInstance() | 获取单例 |
          | recordFrame() | 帧记录 |
          | setGameInfo(engine, resolution, wineVersion) | 设置容器信息 |
          | show() / hide() | 显隐控制 |
          | release() | 资源释放 |

          ## 实例方法

          setShowMask(int), getShowMask(), setDensity(int), getDensity(),
          setVertical(boolean), isVertical(), setScale(float),
          setTextAlpha(float), setBackgroundAlpha(float), setLocked(boolean), resetStats()

          ## 常量

          密度: DENSITY_COMPACT / DENSITY_NORMAL / DENSITY_DETAILED
          元素: 24 个 SHOW_* 位掩码常量
          版本: VERSION = "2.0.0"
          DOC_EOF

          cat > docs/FAQ.md << 'DOC_EOF'
          # 常见问题

          ## HUD 不显示
          确认 WinlatorHUD.init(this) 在游戏主 Activity 的 onCreate 中调用，且文件位于 com.winlator.hud 包路径。

          ## FPS 恒为 0
          确认在 Vulkan/OpenGL 帧呈现后调用了 WinlatorHUD.recordFrame()。

          ## GPU 指标显示 N/A
          非高通 Adreno GPU 的部分节点需要 root 权限读取。

          ## 与 MangoHud 的区别
          MangoHud 基于 Vulkan layer 注入，在 Wine present 机制下存在帧同步冲突。WinlatorHUD 在 Android UI 层独立绘制，不介入渲染管线。

          ## 性能开销
          独立线程 500ms 采样，文本预格式化零 GC，整体 CPU 开销 < 1%。
          DOC_EOF

      - name: Generate patch files
        run: |
          cat > patch/INTEGRATION_GUIDE.md << 'PATCH_EOF'
          # 集成指南

          ## 源码集成
          1. 复制 WinlatorHUD.java 到 app/src/main/java/com/winlator/hud/
          2. XServerDisplayActivity 添加 import com.winlator.hud.WinlatorHUD;
          3. onCreate 末尾: WinlatorHUD.init(this);
          4. onDestroy 中: WinlatorHUD.release();
          5. 渲染循环帧呈现后: WinlatorHUD.recordFrame();

          ## AAR 集成
          1. 下载 Release AAR 放入 app/libs/
          2. build.gradle: implementation files('libs/WinlatorHUD-2.0.0.aar')
          3. 同源码集成步骤 2-5

          ## 验证
          启动游戏 -> 左上角显示 HUD -> 单击切密度 -> 双击切横竖屏 -> 拖拽移动 -> 长按锁定
          PATCH_EOF

          cat > patch/winlator-hud-integration.patch << 'PATCH_EOF'
          diff --git a/app/src/main/java/com/winlator/cmod/XServerDisplayActivity.java b/app/src/main/java/com/winlator/cmod/XServerDisplayActivity.java
          --- a/app/src/main/java/com/winlator/cmod/XServerDisplayActivity.java
          +++ b/app/src/main/java/com/winlator/cmod/XServerDisplayActivity.java
          @@ -20,6 +20,7 @@
          +import com.winlator.hud.WinlatorHUD;
          @@ -150,6 +151,10 @@
              private void init() {
                  setContentView(R.layout.xserver_display_activity);
          +        WinlatorHUD.init(this);
              }
          @@ -200,6 +205,10 @@
              protected void onDestroy() {
          +        WinlatorHUD.release();
                  super.onDestroy();
              }
          PATCH_EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initialize WinlatorHUD v2.0.0 — Android View performance overlay" || echo "No changes to commit"
          git push

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '' && github.event.inputs.release_version != null)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0.2'

      - name: Build AAR
        run: |
          gradle :winlator-hud:assembleRelease --no-daemon --stacktrace
          ls -lh winlator-hud/build/outputs/aar/

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.release_version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename and checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp winlator-hud/build/outputs/aar/winlator-hud-release.aar \
             winlator-hud/build/outputs/aar/WinlatorHUD-$VERSION.aar
          sha256sum winlator-hud/build/outputs/aar/WinlatorHUD-$VERSION.aar > \
             winlator-hud/build/outputs/aar/WinlatorHUD-$VERSION.aar.sha256

      - name: Generate DEX (for MT Manager users)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p aar_extract
          unzip -o winlator-hud/build/outputs/aar/winlator-hud-release.aar -d aar_extract
          D8=$(find "$ANDROID_HOME/build-tools" -name d8 -type f 2>/dev/null | head -1)
          if [ -z "$D8" ]; then
            echo "d8 not found, listing build-tools:"
            ls "$ANDROID_HOME/build-tools/" 2>/dev/null || true
            exit 1
          fi
          echo "Using d8: $D8"
          "$D8" --release --output . aar_extract/classes.jar
          mv classes.dex winlator-hud/build/outputs/aar/WinlatorHUD-$VERSION.dex
          sha256sum winlator-hud/build/outputs/aar/WinlatorHUD-$VERSION.dex > \
             winlator-hud/build/outputs/aar/WinlatorHUD-$VERSION.dex.sha256
          ls -lh winlator-hud/build/outputs/aar/

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_notes.md << NOTES_EOF
          ## WinlatorHUD v$VERSION

          ### 下载说明

          | 文件 | 用途 | 适用人群 |
          |------|------|----------|
          | WinlatorHUD-$VERSION.aar | Android Library 包 | 有编译环境的开发者 |
          | WinlatorHUD-$VERSION.dex | DEX 字节码，MT 管理器可直接合并 | 普通 Winlator 用户 |
          | *.sha256 | 校验文件，可忽略 | 所有人 |

          ### 集成方式

          **方式一：MT 管理器（推荐普通用户）**
          1. 下载 WinlatorHUD-$VERSION.dex
          2. 用 MT 管理器打开目标 Winlator APK，将 dex 合并为 classes2.dex
          3. 在主 Activity onCreate 末尾添加: invoke-static {p0}, Lcom/winlator/hud/WinlatorHUD;->init(Landroid/content/Context;)V
          4. 在渲染循环中添加: invoke-static {}, Lcom/winlator/hud/WinlatorHUD;->recordFrame()V
          5. 保存签名后安装

          **方式二：AAR 依赖（开发者）**
          1. 下载 WinlatorHUD-$VERSION.aar，放入 app/libs/
          2. build.gradle: implementation files('libs/WinlatorHUD-$VERSION.aar')
          3. 代码中调用 WinlatorHUD.init(this) 和 WinlatorHUD.recordFrame()

          ### 兼容性
          Android API 24+ / Winlator 全版本 / Adreno 完全支持
          NOTES_EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WinlatorHUD v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            winlator-hud/build/outputs/aar/WinlatorHUD-${{ steps.version.outputs.version }}.aar
            winlator-hud/build/outputs/aar/WinlatorHUD-${{ steps.version.outputs.version }}.aar.sha256
            winlator-hud/build/outputs/aar/WinlatorHUD-${{ steps.version.outputs.version }}.dex
            winlator-hud/build/outputs/aar/WinlatorHUD-${{ steps.version.outputs.version }}.dex.sha256
